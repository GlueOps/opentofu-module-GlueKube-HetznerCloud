#cloud-config
package_update: true
packages:
  - curl
  - hc-utils=0.0.6-1
hostname: ${hostname}
ssh_pwauth: true
chpasswd:
  expire: false
users:
  - name: cluster
    groups: sudo
    ssh_authorized_keys:
      - ${public_key}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
write_files:
  - content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    path: /etc/sysctl.d/k8s.conf
runcmd:
  - sysctl --system
  - systemctl enable --now qemu-guest-agent
  - sudo systemctl disable --now unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt
