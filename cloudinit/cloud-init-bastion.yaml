#cloud-config
package_update: true
packages:
  - curl
hostname: ${hostname}
ssh_pwauth: false
users:
  - name: cluster
    groups: sudo
    ssh_authorized_keys:
      - ${public_key}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
write_files:
  - content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    path: /etc/sysctl.d/k8s.conf
  - content: |                                                                                                                                                              
      network:                                                                                                                                                              
        version: 2                                                                                                                                                          
        ethernets:                                                                                                                                                          
          enp7s0:                                                                                                                                                           
            dhcp4: true                                                                                                                                                     
    path: /etc/netplan/60-private-network.yaml  
runcmd:
  - netplan apply
  - sysctl --system
  - systemctl enable --now qemu-guest-agent
  - sudo systemctl disable --now unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt
